name: Hosted Windows uninstall probe
on:
  push:
    branches: [fix/windows-uninstall-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Disposable native helper phases
        run: node scripts/windows-uninstall-probe.mjs
