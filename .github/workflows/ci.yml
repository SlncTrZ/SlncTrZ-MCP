name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: typecheck, lint, format, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

  provenance:
    name: dependency license inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record license inventory (warning-only; authoritative gov in PROVENANCE.md)
        run: |
          npx --yes license-checker --summary --out /tmp/licenses.txt
          cat /tmp/licenses.txt
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-inventory
          path: /tmp/licenses.txt
          if-no-files-found: warn

  benchmark:
    name: Linux x64 performance baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record cold-start and memory baseline
        run: npm run benchmark -- --iterations 5 --warmup 1 --out /tmp/benchmark.json

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-linux-x64-node24
          path: /tmp/benchmark.json
          if-no-files-found: error
