<svg role="img" aria-labelledby="intro-title intro-description" viewBox="0 0 960 540" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <title id="intro-title">SlncTrZ-MCP: tools, built-in harness and default skills</title>
  <desc id="intro-description">A self-hosted gateway for AI clients, files, commands and MCP providers. Full connections include product working guidance and the default code-review and debug-and-test skills.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d17" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#0f1c30" />
    </linearGradient>

    <!-- Gateway Card Gradient -->
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e233d" />
      <stop offset="100%" stop-color="#143257" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseLine {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes travelDotY1 {
        0% { cy: 110px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cy: 148px; opacity: 0; }
      }
      @keyframes travelDotY2 {
        0% { cy: 246px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cy: 280px; opacity: 0; }
      }
      @keyframes progressAnim {
        0% { width: 0px; }
        95% { width: 880px; }
        100% { width: 880px; }
      }
      @keyframes glowGateway {
        0%, 100% { stroke: #38bdf8; stroke-opacity: 0.6; }
        50% { stroke: #64e2d5; stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(100, 226, 213, 0.4)); }
      }
      @keyframes cycleScenes {
        0%, 16% { opacity: 1; transform: translateY(0); }
        19%, 97% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycleScene2 {
        0%, 18% { opacity: 0; transform: translateY(-8px); }
        21%, 36% { opacity: 1; transform: translateY(0); }
        39%, 100% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes cycleScene3 {
        0%, 38% { opacity: 0; transform: translateY(-8px); }
        41%, 56% { opacity: 1; transform: translateY(0); }
        59%, 100% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes cycleScene4 {
        0%, 58% { opacity: 0; transform: translateY(-8px); }
        61%, 76% { opacity: 1; transform: translateY(0); }
        79%, 100% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes cycleScene5 {
        0%, 78% { opacity: 0; transform: translateY(-8px); }
        81%, 97% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(8px); }
      }

      .text-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .data-wire { stroke-dasharray: 4 4; animation: pulseLine 1.2s linear infinite; }
      .pulse-node-1 { animation: travelDotY1 1.5s ease-in-out infinite; }
      .pulse-node-2 { animation: travelDotY2 1.5s ease-in-out infinite; }
      .gateway-border { animation: glowGateway 3s ease-in-out infinite; }
      .timeline-bar { animation: progressAnim 12s linear infinite; }

      .scene-1 { animation: cycleScenes 20s infinite; }
      .scene-2 { animation: cycleScene2 20s infinite; }
      .scene-3 { animation: cycleScene3 20s infinite; }
      .scene-4 { animation: cycleScene4 20s infinite; }
      .scene-5 { animation: cycleScene5 20s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .data-wire, .pulse-node-1, .pulse-node-2, .gateway-border, .timeline-bar,
        .scene-1, .scene-2, .scene-3, .scene-4, .scene-5 { animation: none; }
        .scene-2, .scene-3, .scene-4, .scene-5 { display: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Top Bar -->
  <g class="text-base">
    <text x="40" y="42" font-size="13" font-weight="700" fill="#9eafc0" letter-spacing="1.5">SLNCTRZ / MCP</text>
    <text x="920" y="42" font-size="11" font-weight="700" fill="#64e2d5" text-anchor="end" letter-spacing="1">PUT AI TO WORK ON REAL PROJECTS</text>
    <line x1="40" y1="56" x2="920" y2="56" stroke="#293d55" stroke-width="1.5" />
  </g>

  <!-- Left Column: Marketing Message (width ~380px) -->
  <g class="text-base" transform="translate(40, 0)">
    <!-- Scene 1: Real project work -->
    <g class="scene-1">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#64e2d5" letter-spacing="1.5">REAL PROJECT WORK</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Go beyond chat.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#edf5fa">Put AI to work.</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#64e2d5">On your projects.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Less copy-paste between chat and your editor.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Connect your AI client to authorized project files.</text>
    </g>

    <!-- Scene 2: Files and commands -->
    <g class="scene-2" opacity="0">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#64e2d5" letter-spacing="1.5">FILES AND COMMANDS</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Read and edit.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#64e2d5">Run your checks.</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#edf5fa">Report results.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Describe the task in the client you already use.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Search files, make changes and check the result.</text>
    </g>

    <!-- Scene 3: Built-in harness and default skills -->
    <g class="scene-3" opacity="0">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#ff977c" letter-spacing="1.5">BUILT-IN HARNESS</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Guidance built in.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#edf5fa">Review code.</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#ff977c">Debug and test.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Product working rules + editable instructions.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Default skills loaded only when they are needed.</text>
    </g>

    <!-- Scene 4: MCP providers -->
    <g class="scene-4" opacity="0">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">MCP PROVIDERS</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">One gateway.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#38bdf8">Connect providers.</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#edf5fa">Reuse your tools.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Connect configured CAD tools, CyberBrain</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">and your own MCP servers through one endpoint.</text>
    </g>

    <!-- Scene 5: Debate and coordination -->
    <g class="scene-5" opacity="0">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#64e2d5" letter-spacing="1.5">DEBATE AND COORDINATION</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Compare ideas.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#edf5fa">Challenge plans.</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#64e2d5">Coordinate work.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Use two-agent Debate to examine proposals.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Track tasks and share work between agents.</text>
    </g>

    <!-- Pill Badges -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="52.5" y="18" font-size="11" font-weight="600" fill="#64e2d5" text-anchor="middle">Win &amp; Linux</text>

      <rect x="115" y="0" width="105" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="167.5" y="18" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Quick setup</text>

      <rect x="230" y="0" width="105" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="282.5" y="18" font-size="11" font-weight="600" fill="#edf5fa" text-anchor="middle">Open source</text>

      <rect x="0" y="36" width="115" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="57.5" y="54" font-size="11" font-weight="600" fill="#ff977c" text-anchor="middle">Owner control</text>

      <rect x="125" y="36" width="145" height="28" rx="14" fill="#0d2640" stroke="#38bdf8" stroke-width="1" />
      <text x="197.5" y="54" font-size="11" font-weight="700" fill="#64e2d5" text-anchor="middle">Default skills</text>
    </g>
  </g>

  <!-- Right Column: Capability Flow Stage (width: 480, height: 410, x: 440, y: 78) -->
  <g class="text-base" transform="translate(440, 78)">
    <!-- Outer Stage Panel -->
    <rect x="0" y="0" width="480" height="408" rx="16" fill="#121e31" stroke="#223650" stroke-width="1.5" />
    
    <!-- Stage Header -->
    <path d="M 0 16 Q 0 0 16 0 L 464 0 Q 480 0 480 16 L 480 38 L 0 38 Z" fill="#172840" />
    <circle cx="20" cy="19" r="4.5" fill="#ff5f56" />
    <circle cx="34" cy="19" r="4.5" fill="#ffbd2e" />
    <circle cx="48" cy="19" r="4.5" fill="#27c93f" />
    <text x="66" y="23" font-size="11" font-weight="700" fill="#9eafc0" letter-spacing="0.8">OWNER-CONTROLLED GATEWAY</text>
    <rect x="375" y="10" width="90" height="18" rx="9" fill="#0b1726" stroke="#223b5c" stroke-width="1" />
    <text x="420" y="23" font-size="9.5" font-weight="600" fill="#64e2d5" text-anchor="middle">MCP</text>
    <line x1="0" y1="38" x2="480" y2="38" stroke="#223650" stroke-width="1" />

    <!-- Layer 1: AI Clients Box -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="440" height="58" rx="10" fill="#182b46" stroke="#2b476e" stroke-width="1.5" />
      <text x="18" y="25" font-size="14" font-weight="700" fill="#edf5fa">Your AI clients</text>
      <text x="18" y="44" font-size="10.5" font-weight="400" fill="#9eafc0">ChatGPT · Claude · Cursor · Pi · OpenCode</text>
      <rect x="355" y="16" width="68" height="24" rx="6" fill="#102035" stroke="#38bdf8" stroke-width="1" />
      <text x="389" y="32" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">CHOOSE</text>
    </g>

    <!-- Connector Wire 1 -->
    <line x1="240" y1="110" x2="240" y2="148" stroke="#293d55" stroke-width="3" />
    <line x1="240" y1="110" x2="240" y2="148" stroke="#64e2d5" stroke-width="2" class="data-wire" />
    <circle cx="240" cy="129" r="4.5" fill="#64e2d5" class="pulse-node-1" filter="url(#cyanGlow)" />

    <!-- Layer 2: Gateway Core -->
    <g transform="translate(20, 148)">
      <rect x="0" y="0" width="440" height="98" rx="12" fill="url(#gatewayGrad)" class="gateway-border" stroke-width="2" />
      <text x="18" y="28" font-size="17" font-weight="800" fill="#64e2d5">SlncTrZ-MCP — Tools + Harness</text>
      <text x="18" y="48" font-size="11" font-weight="400" fill="#edf5fa">Owner policies · Progressive context · Local execution</text>
      
      <!-- Feature Pills inside Gateway Core -->
      <g transform="translate(18, 64)">
        <rect x="0" y="0" width="94" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="47" y="15" font-size="9.5" font-weight="600" fill="#64e2d5" text-anchor="middle">OAuth control</text>

        <rect x="102" y="0" width="96" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="150" y="15" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Atomic writes</text>

        <rect x="206" y="0" width="92" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="252" y="15" font-size="9.5" font-weight="600" fill="#ff977c" text-anchor="middle">Built-in skills</text>

        <rect x="306" y="0" width="94" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="353" y="15" font-size="9.5" font-weight="600" fill="#9eafc0" text-anchor="middle">On demand</text>
      </g>
    </g>

    <!-- Connector Wire 2 -->
    <line x1="240" y1="246" x2="240" y2="280" stroke="#293d55" stroke-width="3" />
    <line x1="240" y1="246" x2="240" y2="280" stroke="#38bdf8" stroke-width="2" class="data-wire" />
    <circle cx="240" cy="263" r="4.5" fill="#38bdf8" class="pulse-node-2" filter="url(#cyanGlow)" />

    <!-- Branch Wire Splitters to 3 Provider Cards -->
    <path d="M 240 280 L 88 280 L 88 296" fill="none" stroke="#293d55" stroke-width="2" />
    <path d="M 240 280 L 240 296" fill="none" stroke="#293d55" stroke-width="2" />
    <path d="M 240 280 L 392 280 L 392 296" fill="none" stroke="#293d55" stroke-width="2" />

    <!-- Layer 3: 3 Output Capabilities -->
    <g transform="translate(20, 296)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="92" rx="9" fill="#14263f" stroke="#243f66" stroke-width="1.5" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#edf5fa">Files &amp; Commands</text>
        <text x="10" y="38" font-size="10" font-weight="600" fill="#64e2d5">Read · Edit · Run</text>
        <text x="10" y="56" font-size="9" font-weight="400" fill="#9eafc0">Search project files,</text>
        <text x="10" y="70" font-size="9" font-weight="400" fill="#9eafc0">apply targeted edits,</text>
        <text x="10" y="84" font-size="9" font-weight="400" fill="#9eafc0">run authorized checks</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="140" height="92" rx="9" fill="#14263f" stroke="#243f66" stroke-width="1.5" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#edf5fa">MCP Providers</text>
        <text x="10" y="38" font-size="10" font-weight="600" fill="#ff977c">Configured tools</text>
        <text x="10" y="56" font-size="9" font-weight="400" fill="#9eafc0">CAD, CyberBrain</text>
        <text x="10" y="70" font-size="9" font-weight="400" fill="#9eafc0">and your own</text>
        <text x="10" y="84" font-size="9" font-weight="400" fill="#9eafc0">MCP integrations</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="138" height="92" rx="9" fill="#14263f" stroke="#243f66" stroke-width="1.5" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#edf5fa">Harness &amp; Skills</text>
        <text x="10" y="38" font-size="10" font-weight="600" fill="#38bdf8">Installed defaults</text>
        <text x="10" y="56" font-size="9" font-weight="400" fill="#9eafc0">code-review</text>
        <text x="10" y="70" font-size="9" font-weight="400" fill="#9eafc0">debug-and-test</text>
        <text x="10" y="84" font-size="9" font-weight="400" fill="#9eafc0">Load skills as needed</text>
      </g>
    </g>
  </g>

  <!-- Bottom Timeline & Status Bar -->
  <g class="text-base">
    <line x1="40" y1="500" x2="920" y2="500" stroke="#293d55" stroke-width="1.5" />
    <rect x="40" y="499" height="3" rx="1.5" fill="#64e2d5" class="timeline-bar" filter="url(#cyanGlow)" />
    <text x="40" y="524" font-size="11" font-weight="700" fill="#9eafc0" letter-spacing="0.5">SLNCTRZ-MCP  |  YOUR AI CLIENT, CONNECTED TO YOUR TOOLS</text>
    <text x="920" y="524" font-size="11" font-weight="700" fill="#64e2d5" text-anchor="end" class="mono">github.com/SlncTrZ/SlncTrZ-MCP</text>
  </g>
</svg>