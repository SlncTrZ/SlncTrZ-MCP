<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d17" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#0f1c30" />
    </linearGradient>

    <!-- Gateway Card Gradient -->
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e233d" />
      <stop offset="100%" stop-color="#143257" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      @keyframes pulseLine {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes travelDotY1 {
        0% { cy: 300px; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { cy: 400px; opacity: 0; }
      }
      @keyframes travelDotY2 {
        0% { cy: 590px; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { cy: 690px; opacity: 0; }
      }
      @keyframes progressAnim {
        0% { width: 0px; }
        95% { width: 1720px; }
        100% { width: 1720px; }
      }
      @keyframes glowGateway {
        0%, 100% { stroke: #38bdf8; stroke-opacity: 0.6; }
        50% { stroke: #64e2d5; stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(100, 226, 213, 0.4)); }
      }
      @keyframes cycleScenes {
        0%, 15% { opacity: 1; transform: translateY(0); }
        18%, 97% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycleScene2 {
        0%, 17% { opacity: 0; transform: translateY(-12px); }
        20%, 35% { opacity: 1; transform: translateY(0); }
        38%, 100% { opacity: 0; transform: translateY(12px); }
      }
      @keyframes cycleScene3 {
        0%, 37% { opacity: 0; transform: translateY(-12px); }
        40%, 55% { opacity: 1; transform: translateY(0); }
        58%, 100% { opacity: 0; transform: translateY(12px); }
      }
      @keyframes cycleScene4 {
        0%, 57% { opacity: 0; transform: translateY(-12px); }
        60%, 75% { opacity: 1; transform: translateY(0); }
        78%, 100% { opacity: 0; transform: translateY(12px); }
      }
      @keyframes cycleScene5 {
        0%, 77% { opacity: 0; transform: translateY(-12px); }
        80%, 97% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(12px); }
      }

      .text-base { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
      .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .data-wire { stroke-dasharray: 8 6; animation: pulseLine 1.4s linear infinite; }
      .pulse-node-1 { animation: travelDotY1 1.6s ease-in-out infinite; }
      .pulse-node-2 { animation: travelDotY2 1.6s ease-in-out infinite; }
      .gateway-border { animation: glowGateway 3s ease-in-out infinite; }
      .timeline-bar { animation: progressAnim 12s linear infinite; }

      .scene-1 { animation: cycleScenes 20s infinite; }
      .scene-2 { animation: cycleScene2 20s infinite; }
      .scene-3 { animation: cycleScene3 20s infinite; }
      .scene-4 { animation: cycleScene4 20s infinite; }
      .scene-5 { animation: cycleScene5 20s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Top Bar -->
  <g class="text-base">
    <text x="100" y="85" font-size="22" font-weight="700" fill="#9eafc0" letter-spacing="2">SLNCTRZ / MCP</text>
    <text x="1820" y="85" font-size="18" font-weight="700" fill="#64e2d5" text-anchor="end" letter-spacing="1.5">ĐƯA AI VÀO CÔNG VIỆC THẬT CỦA BẠN</text>
    <line x1="100" y1="115" x2="1820" y2="115" stroke="#293d55" stroke-width="2" />
  </g>

  <!-- Left Column: Storyboard Typography & Value Proposition -->
  <g class="text-base" transform="translate(100, 0)">
    <!-- Sub-scene 1: Thực tế -->
    <g class="scene-1">
      <text x="0" y="230" font-size="22" font-weight="700" fill="#64e2d5" letter-spacing="2">LÀM VIỆC THỰC TẾ</text>
      <text x="0" y="325" font-size="64" font-weight="800" fill="#edf5fa">Đừng chỉ chat.</text>
      <text x="0" y="415" font-size="64" font-weight="800" fill="#edf5fa">Hãy để AI</text>
      <text x="0" y="505" font-size="64" font-weight="800" fill="#64e2d5">bắt tay vào làm.</text>
      <text x="0" y="595" font-size="26" font-weight="400" fill="#9eafc0">Hết thời copy-paste qua lại giữa web và code.</text>
      <text x="0" y="645" font-size="26" font-weight="400" fill="#9eafc0">Kết nối thẳng AI vào thư mục dự án trên máy bạn.</text>
    </g>

    <!-- Sub-scene 2: Tự động -->
    <g class="scene-2">
      <text x="0" y="230" font-size="22" font-weight="700" fill="#64e2d5" letter-spacing="2">GIAO VIỆC TỰ NHIÊN</text>
      <text x="0" y="325" font-size="64" font-weight="800" fill="#edf5fa">Tự đọc code,</text>
      <text x="0" y="415" font-size="64" font-weight="800" fill="#64e2d5">sửa file chuẩn xác.</text>
      <text x="0" y="505" font-size="64" font-weight="800" fill="#edf5fa">Chạy thử tại chỗ.</text>
      <text x="0" y="595" font-size="26" font-weight="400" fill="#9eafc0">Bạn chỉ cần giao việc bằng lời tự nhiên.</text>
      <text x="0" y="645" font-size="26" font-weight="400" fill="#9eafc0">AI tự tìm file, sửa code và kiểm tra kết quả ngay.</text>
    </g>

    <!-- Sub-scene 3: An toàn -->
    <g class="scene-3">
      <text x="0" y="230" font-size="22" font-weight="700" fill="#ff977c" letter-spacing="2">AN TÂM TUYỆT ĐỐI</text>
      <text x="0" y="325" font-size="64" font-weight="800" fill="#edf5fa">Toàn quyền kiểm soát.</text>
      <text x="0" y="415" font-size="64" font-weight="800" fill="#edf5fa">Dữ liệu không</text>
      <text x="0" y="505" font-size="64" font-weight="800" fill="#ff977c">rời khỏi máy.</text>
      <text x="0" y="595" font-size="26" font-weight="400" fill="#9eafc0">Chỉ truy cập đúng thư mục và lệnh bạn cho phép.</text>
      <text x="0" y="645" font-size="26" font-weight="400" fill="#9eafc0">Không gửi mã nguồn lên đám mây ngoài ý muốn.</text>
    </g>

    <!-- Sub-scene 4: Mở rộng -->
    <g class="scene-4">
      <text x="0" y="230" font-size="22" font-weight="700" fill="#38bdf8" letter-spacing="2">MỞ RỘNG DỄ DÀNG</text>
      <text x="0" y="325" font-size="64" font-weight="800" fill="#edf5fa">Cắm là chạy.</text>
      <text x="0" y="415" font-size="64" font-weight="800" fill="#38bdf8">Kết nối mọi</text>
      <text x="0" y="505" font-size="64" font-weight="800" fill="#edf5fa">công cụ bạn có.</text>
      <text x="0" y="595" font-size="26" font-weight="400" fill="#9eafc0">Một cổng duy nhất mở sang thiết kế CAD/3D,</text>
      <text x="0" y="645" font-size="26" font-weight="400" fill="#9eafc0">trí nhớ CyberBrain hay các công cụ cá nhân.</text>
    </g>

    <!-- Sub-scene 5: Phối hợp -->
    <g class="scene-5">
      <text x="0" y="230" font-size="22" font-weight="700" fill="#64e2d5" letter-spacing="2">LÀM VIỆC THEO NHÓM</text>
      <text x="0" y="325" font-size="64" font-weight="800" fill="#edf5fa">Nhiều AI cùng làm.</text>
      <text x="0" y="415" font-size="64" font-weight="800" fill="#edf5fa">Tự phản biện,</text>
      <text x="0" y="505" font-size="64" font-weight="800" fill="#64e2d5">tránh làm ẩu.</text>
      <text x="0" y="595" font-size="26" font-weight="400" fill="#9eafc0">AI lên kế hoạch ➔ AI phản biện soát lỗi ➔ AI thực thi.</text>
      <text x="0" y="645" font-size="26" font-weight="400" fill="#9eafc0">Giảm thiểu tối đa sai sót và nhầm lẫn khi làm việc.</text>
    </g>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 720)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#142237" stroke="#293d55" stroke-width="1.5" />
      <text x="90" y="27" font-size="16" font-weight="600" fill="#64e2d5" text-anchor="middle">Windows &amp; Linux</text>

      <rect x="195" y="0" width="180" height="42" rx="21" fill="#142237" stroke="#293d55" stroke-width="1.5" />
      <text x="285" y="27" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">Cài đặt 1 phút</text>

      <rect x="390" y="0" width="180" height="42" rx="21" fill="#142237" stroke="#293d55" stroke-width="1.5" />
      <text x="480" y="27" font-size="16" font-weight="600" fill="#edf5fa" text-anchor="middle">Mã nguồn mở</text>

      <rect x="585" y="0" width="160" height="42" rx="21" fill="#142237" stroke="#293d55" stroke-width="1.5" />
      <text x="665" y="27" font-size="16" font-weight="600" fill="#ff977c" text-anchor="middle">Riêng tư 100%</text>
    </g>
  </g>

  <!-- Right Column: Visual Interactive Architecture Panel (900 to 1820, w: 920) -->
  <g class="text-base" transform="translate(900, 160)">
    <!-- Outer Stage Panel -->
    <rect x="0" y="0" width="920" height="730" rx="24" fill="#121e31" stroke="#223650" stroke-width="2" filter="url(#panelShadow)" />
    
    <!-- Stage Header -->
    <path d="M 0 24 Q 0 0 24 0 L 896 0 Q 920 0 920 24 L 920 65 L 0 65 Z" fill="#172840" />
    <circle cx="36" cy="32" r="7" fill="#ff5f56" />
    <circle cx="58" cy="32" r="7" fill="#ffbd2e" />
    <circle cx="80" cy="32" r="7" fill="#27c93f" />
    <text x="110" y="38" font-size="18" font-weight="700" fill="#9eafc0" letter-spacing="1">TỪ Ý TƯỞNG ĐẾN KẾT QUẢ THẬT</text>
    <rect x="730" y="18" width="160" height="28" rx="14" fill="#0b1726" stroke="#223b5c" stroke-width="1" />
    <text x="810" y="37" font-size="14" font-weight="600" fill="#64e2d5" text-anchor="middle">SẴN SÀNG LÀM VIỆC</text>
    <line x1="0" y1="65" x2="920" y2="65" stroke="#223650" stroke-width="1.5" />

    <!-- Layer 1: AI Clients Box -->
    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="840" height="105" rx="16" fill="#182b46" stroke="#2b476e" stroke-width="2" />
      <text x="35" y="42" font-size="24" font-weight="700" fill="#edf5fa">Ứng dụng AI bạn yêu thích</text>
      <text x="35" y="78" font-size="18" font-weight="400" fill="#9eafc0">ChatGPT trên web · Claude · Cursor · Pi Assistant · Coding Agents</text>
      <rect x="690" y="32" width="115" height="38" rx="8" fill="#102035" stroke="#38bdf8" stroke-width="1.5" />
      <text x="747" y="56" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">BẠN CHỌN</text>
    </g>

    <!-- Central Connecting Bus 1 -->
    <line x1="460" y1="200" x2="460" y2="280" stroke="#293d55" stroke-width="4" />
    <line x1="460" y1="200" x2="460" y2="280" stroke="#64e2d5" stroke-width="3" class="data-wire" />
    <circle cx="460" cy="240" r="6" fill="#64e2d5" class="pulse-node-1" filter="url(#cyanGlow)" />

    <!-- Layer 2: SlncTrZ-MCP Universal Gateway Core -->
    <g transform="translate(40, 280)">
      <rect x="0" y="0" width="840" height="180" rx="18" fill="url(#gatewayGrad)" class="gateway-border" stroke-width="3" />
      
      <!-- Core Title & Sub -->
      <g transform="translate(35, 45)">
        <text x="0" y="0" font-size="32" font-weight="800" fill="#64e2d5">SlncTrZ-MCP — Trợ lý thực thi</text>
        <text x="0" y="36" font-size="18" font-weight="400" fill="#edf5fa">Cầu nối thông minh: Bảo vệ máy tính · Điều phối công việc tự động</text>
      </g>
      
      <!-- Feature Pills inside Gateway Core -->
      <g transform="translate(35, 115)">
        <rect x="0" y="0" width="170" height="36" rx="8" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="85" y="23" font-size="15" font-weight="600" fill="#64e2d5" text-anchor="middle">Cấp quyền an toàn</text>

        <rect x="185" y="0" width="200" height="36" rx="8" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="285" y="23" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="middle">Chống ghi đè lỗi</text>

        <rect x="400" y="0" width="180" height="36" rx="8" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="490" y="23" font-size="15" font-weight="600" fill="#ff977c" text-anchor="middle">Dữ liệu tại máy</text>

        <rect x="595" y="0" width="175" height="36" rx="8" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="682" y="23" font-size="15" font-weight="600" fill="#9eafc0" text-anchor="middle">Cài 1 lần dùng mãi</text>
      </g>
    </g>

    <!-- Central Connecting Bus 2 -->
    <line x1="460" y1="460" x2="460" y2="520" stroke="#293d55" stroke-width="4" />
    <line x1="460" y1="460" x2="460" y2="520" stroke="#38bdf8" stroke-width="3" class="data-wire" />
    <circle cx="460" cy="490" r="6" fill="#38bdf8" class="pulse-node-2" filter="url(#cyanGlow)" />

    <!-- Branch Wire Splitters to 3 Provider Cards -->
    <path d="M 460 520 L 175 520 L 175 545" fill="none" stroke="#293d55" stroke-width="2.5" />
    <path d="M 460 520 L 460 545" fill="none" stroke="#293d55" stroke-width="2.5" />
    <path d="M 460 520 L 745 520 L 745 545" fill="none" stroke="#293d55" stroke-width="2.5" />

    <!-- Layer 3: Capabilities & Output -->
    <g transform="translate(40, 545)">
      <!-- Card 1: Mã nguồn & File -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="265" height="145" rx="14" fill="#14263f" stroke="#243f66" stroke-width="2" />
        <rect x="18" y="16" width="44" height="28" rx="6" fill="#0d1b2d" stroke="#64e2d5" stroke-width="1" />
        <text x="40" y="35" font-size="14" font-weight="700" fill="#64e2d5" text-anchor="middle">CODE</text>
        <text x="72" y="36" font-size="18" font-weight="700" fill="#edf5fa">Mã nguồn &amp; File</text>
        <text x="18" y="75" font-size="15" font-weight="600" fill="#64e2d5">Đọc &amp; Sửa trực tiếp</text>
        <text x="18" y="102" font-size="14" font-weight="400" fill="#9eafc0">Tìm file thông minh, sửa code</text>
        <text x="18" y="124" font-size="14" font-weight="400" fill="#9eafc0">chuẩn xác, chạy lệnh test</text>
      </g>

      <!-- Card 2: Phần mềm kỹ thuật -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="265" height="145" rx="14" fill="#14263f" stroke="#243f66" stroke-width="2" />
        <rect x="18" y="16" width="44" height="28" rx="6" fill="#0d1b2d" stroke="#ff977c" stroke-width="1" />
        <text x="40" y="35" font-size="14" font-weight="700" fill="#ff977c" text-anchor="middle">CAD</text>
        <text x="72" y="36" font-size="18" font-weight="700" fill="#edf5fa">Phần mềm kỹ thuật</text>
        <text x="18" y="75" font-size="15" font-weight="600" fill="#ff977c">AutoCAD · SolidWorks</text>
        <text x="18" y="102" font-size="14" font-weight="400" fill="#9eafc0">SketchUp, Blender, KiCad</text>
        <text x="18" y="124" font-size="14" font-weight="400" fill="#9eafc0">tự động vẽ và tạo mô hình</text>
      </g>

      <!-- Card 3: Bộ nhớ & Công cụ riêng -->
      <g transform="translate(570, 0)">
        <rect x="0" y="0" width="270" height="145" rx="14" fill="#14263f" stroke="#243f66" stroke-width="2" />
        <rect x="18" y="16" width="44" height="28" rx="6" fill="#0d1b2d" stroke="#38bdf8" stroke-width="1" />
        <text x="40" y="35" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">AI</text>
        <text x="72" y="36" font-size="18" font-weight="700" fill="#edf5fa">Trí nhớ &amp; Mở rộng</text>
        <text x="18" y="75" font-size="15" font-weight="600" fill="#38bdf8">CyberBrain Memory</text>
        <text x="18" y="102" font-size="14" font-weight="400" fill="#9eafc0">Lưu nhớ thói quen làm việc,</text>
        <text x="18" y="124" font-size="14" font-weight="400" fill="#9eafc0">kết nối script và API riêng</text>
      </g>
    </g>
  </g>

  <!-- Bottom Timeline & Status Bar -->
  <g class="text-base">
    <line x1="100" y1="970" x2="1820" y2="970" stroke="#293d55" stroke-width="2" />
    <rect x="100" y="968" height="4" rx="2" fill="#64e2d5" class="timeline-bar" filter="url(#cyanGlow)" />
    <text x="100" y="1015" font-size="20" font-weight="700" fill="#9eafc0" letter-spacing="1">SLNCTRZ-MCP  |  CẦU NỐI AI VÀ MÁY TÍNH CỦA BẠN</text>
    <text x="1820" y="1015" font-size="20" font-weight="700" fill="#64e2d5" text-anchor="end" class="mono">github.com/SlncTrZ/SlncTrZ-MCP</text>
  </g>
</svg>