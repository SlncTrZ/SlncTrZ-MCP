<svg viewBox="0 0 960 540" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d17" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#0f1c30" />
    </linearGradient>

    <!-- Gateway Card Gradient -->
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e233d" />
      <stop offset="100%" stop-color="#143257" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseLine {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes travelDotY1 {
        0% { cy: 185px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cy: 220px; opacity: 0; }
      }
      @keyframes travelDotY2 {
        0% { cy: 326px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cy: 358px; opacity: 0; }
      }
      @keyframes progressAnim {
        0% { width: 0px; }
        95% { width: 880px; }
        100% { width: 880px; }
      }
      @keyframes glowGateway {
        0%, 100% { stroke: #38bdf8; stroke-opacity: 0.6; }
        50% { stroke: #64e2d5; stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(100, 226, 213, 0.4)); }
      }
      @keyframes cycleScenes {
        0%, 16% { opacity: 1; transform: translateY(0); }
        19%, 97% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycleScene2 {
        0%, 18% { opacity: 0; transform: translateY(-8px); }
        21%, 36% { opacity: 1; transform: translateY(0); }
        39%, 100% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes cycleScene3 {
        0%, 38% { opacity: 0; transform: translateY(-8px); }
        41%, 56% { opacity: 1; transform: translateY(0); }
        59%, 100% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes cycleScene4 {
        0%, 58% { opacity: 0; transform: translateY(-8px); }
        61%, 76% { opacity: 1; transform: translateY(0); }
        79%, 100% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes cycleScene5 {
        0%, 78% { opacity: 0; transform: translateY(-8px); }
        81%, 97% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(8px); }
      }

      .text-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .data-wire { stroke-dasharray: 4 4; animation: pulseLine 1.2s linear infinite; }
      .pulse-node-1 { animation: travelDotY1 1.5s ease-in-out infinite; }
      .pulse-node-2 { animation: travelDotY2 1.5s ease-in-out infinite; }
      .gateway-border { animation: glowGateway 3s ease-in-out infinite; }
      .timeline-bar { animation: progressAnim 12s linear infinite; }

      .scene-1 { animation: cycleScenes 20s infinite; }
      .scene-2 { animation: cycleScene2 20s infinite; }
      .scene-3 { animation: cycleScene3 20s infinite; }
      .scene-4 { animation: cycleScene4 20s infinite; }
      .scene-5 { animation: cycleScene5 20s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Top Bar -->
  <g class="text-base">
    <text x="40" y="42" font-size="13" font-weight="700" fill="#9eafc0" letter-spacing="1.5">SLNCTRZ / MCP</text>
    <text x="920" y="42" font-size="11" font-weight="700" fill="#64e2d5" text-anchor="end" letter-spacing="1">ĐƯA AI VÀO CÔNG VIỆC THẬT CỦA BẠN</text>
    <line x1="40" y1="56" x2="920" y2="56" stroke="#293d55" stroke-width="1.5" />
  </g>

  <!-- Left Column: Marketing Message (width ~380px) -->
  <g class="text-base" transform="translate(40, 0)">
    <!-- Scene 1: Làm việc thực tế -->
    <g class="scene-1">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#64e2d5" letter-spacing="1.5">LÀM VIỆC THỰC TẾ</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Đừng chỉ chat.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#edf5fa">Hãy để AI</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#64e2d5">bắt tay vào làm.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Hết thời copy-paste qua lại giữa web và code.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Kết nối AI thẳng vào thư mục dự án trên máy bạn.</text>
    </g>

    <!-- Scene 2: Tự động hoá -->
    <g class="scene-2">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#64e2d5" letter-spacing="1.5">GIAO VIỆC TỰ NHIÊN</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Tự đọc code,</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#64e2d5">sửa file chuẩn xác.</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#edf5fa">Chạy thử tại chỗ.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Bạn chỉ cần giao việc bằng lời tự nhiên.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">AI tự tìm file, sửa mã và kiểm tra kết quả ngay.</text>
    </g>

    <!-- Scene 3: An toàn & Riêng tư -->
    <g class="scene-3">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#ff977c" letter-spacing="1.5">AN TÂM TUYỆT ĐỐI</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Toàn quyền kiểm soát.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#edf5fa">Dữ liệu không</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#ff977c">rời khỏi máy.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Chỉ truy cập đúng thư mục và lệnh bạn cho phép.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Không gửi mã nguồn lên đám mây ngoài ý muốn.</text>
    </g>

    <!-- Scene 4: Mở rộng -->
    <g class="scene-4">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">MỞ RỘNG DỄ DÀNG</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Cắm là chạy.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#38bdf8">Kết nối mọi</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#edf5fa">công cụ bạn có.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">Một cổng duy nhất mở rộng sang thiết kế CAD,</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">trí nhớ CyberBrain hay các công cụ cá nhân.</text>
    </g>

    <!-- Scene 5: Phối hợp -->
    <g class="scene-5">
      <text x="0" y="105" font-size="12" font-weight="700" fill="#64e2d5" letter-spacing="1.5">LÀM VIỆC THEO NHÓM</text>
      <text x="0" y="152" font-size="33" font-weight="800" fill="#edf5fa">Nhiều AI cùng làm.</text>
      <text x="0" y="197" font-size="33" font-weight="800" fill="#edf5fa">Tự phản biện,</text>
      <text x="0" y="242" font-size="33" font-weight="800" fill="#64e2d5">tránh làm ẩu.</text>
      <text x="0" y="288" font-size="14.5" font-weight="400" fill="#9eafc0">AI lên kế hoạch ➔ AI soát lỗi ➔ AI thực thi.</text>
      <text x="0" y="314" font-size="14.5" font-weight="400" fill="#9eafc0">Giảm thiểu tối đa sai sót và nhầm lẫn khi làm việc.</text>
    </g>

    <!-- Pill Badges -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="52.5" y="18" font-size="11" font-weight="600" fill="#64e2d5" text-anchor="middle">Win &amp; Linux</text>

      <rect x="115" y="0" width="105" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="167.5" y="18" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Cài 1 phút</text>

      <rect x="230" y="0" width="105" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="282.5" y="18" font-size="11" font-weight="600" fill="#edf5fa" text-anchor="middle">Mã nguồn mở</text>

      <rect x="0" y="36" width="115" height="28" rx="14" fill="#142237" stroke="#293d55" stroke-width="1" />
      <text x="57.5" y="54" font-size="11" font-weight="600" fill="#ff977c" text-anchor="middle">Riêng tư 100%</text>

      <rect x="125" y="36" width="145" height="28" rx="14" fill="#0d2640" stroke="#38bdf8" stroke-width="1" />
      <text x="197.5" y="54" font-size="11" font-weight="700" fill="#64e2d5" text-anchor="middle">▶ Video 60s (16:9)</text>
    </g>
  </g>

  <!-- Right Column: Capability Flow Stage (width: 480, height: 410, x: 440, y: 78) -->
  <g class="text-base" transform="translate(440, 78)">
    <!-- Outer Stage Panel -->
    <rect x="0" y="0" width="480" height="408" rx="16" fill="#121e31" stroke="#223650" stroke-width="1.5" />
    
    <!-- Stage Header -->
    <path d="M 0 16 Q 0 0 16 0 L 464 0 Q 480 0 480 16 L 480 38 L 0 38 Z" fill="#172840" />
    <circle cx="20" cy="19" r="4.5" fill="#ff5f56" />
    <circle cx="34" cy="19" r="4.5" fill="#ffbd2e" />
    <circle cx="48" cy="19" r="4.5" fill="#27c93f" />
    <text x="66" y="23" font-size="11" font-weight="700" fill="#9eafc0" letter-spacing="0.8">HỆ THỐNG THỰC THI AN TOÀN</text>
    <rect x="375" y="10" width="90" height="18" rx="9" fill="#0b1726" stroke="#223b5c" stroke-width="1" />
    <text x="420" y="23" font-size="9.5" font-weight="600" fill="#64e2d5" text-anchor="middle">SẴN SÀNG CHẠY</text>
    <line x1="0" y1="38" x2="480" y2="38" stroke="#223650" stroke-width="1" />

    <!-- Layer 1: AI Clients Box -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="440" height="58" rx="10" fill="#182b46" stroke="#2b476e" stroke-width="1.5" />
      <text x="18" y="25" font-size="14" font-weight="700" fill="#edf5fa">Ứng dụng AI bạn yêu thích</text>
      <text x="18" y="44" font-size="11" font-weight="400" fill="#9eafc0">ChatGPT trên web · Claude · Cursor · Pi Assistant · Coding Agents</text>
      <rect x="355" y="16" width="68" height="24" rx="6" fill="#102035" stroke="#38bdf8" stroke-width="1" />
      <text x="389" y="32" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">BẠN CHỌN</text>
    </g>

    <!-- Connector Wire 1 -->
    <line x1="240" y1="110" x2="240" y2="148" stroke="#293d55" stroke-width="3" />
    <line x1="240" y1="110" x2="240" y2="148" stroke="#64e2d5" stroke-width="2" class="data-wire" />
    <circle cx="240" cy="129" r="4.5" fill="#64e2d5" class="pulse-node-1" filter="url(#cyanGlow)" />

    <!-- Layer 2: Gateway Core -->
    <g transform="translate(20, 148)">
      <rect x="0" y="0" width="440" height="98" rx="12" fill="url(#gatewayGrad)" class="gateway-border" stroke-width="2" />
      <text x="18" y="28" font-size="17" font-weight="800" fill="#64e2d5">SlncTrZ-MCP — Trợ lý thực thi</text>
      <text x="18" y="48" font-size="11" font-weight="400" fill="#edf5fa">Cầu nối phân quyền an toàn · Xử lý 100% tại máy tính cá nhân</text>
      
      <!-- Feature Pills inside Gateway Core -->
      <g transform="translate(18, 64)">
        <rect x="0" y="0" width="94" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="47" y="15" font-size="9.5" font-weight="600" fill="#64e2d5" text-anchor="middle">Cấp quyền an toàn</text>

        <rect x="102" y="0" width="96" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="150" y="15" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Chống ghi đè lỗi</text>

        <rect x="206" y="0" width="92" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="252" y="15" font-size="9.5" font-weight="600" fill="#ff977c" text-anchor="middle">Dữ liệu tại máy</text>

        <rect x="306" y="0" width="94" height="22" rx="5" fill="#0b1a2e" stroke="#214269" stroke-width="1" />
        <text x="353" y="15" font-size="9.5" font-weight="600" fill="#9eafc0" text-anchor="middle">Cài 1 lần dùng mãi</text>
      </g>
    </g>

    <!-- Connector Wire 2 -->
    <line x1="240" y1="246" x2="240" y2="280" stroke="#293d55" stroke-width="3" />
    <line x1="240" y1="246" x2="240" y2="280" stroke="#38bdf8" stroke-width="2" class="data-wire" />
    <circle cx="240" cy="263" r="4.5" fill="#38bdf8" class="pulse-node-2" filter="url(#cyanGlow)" />

    <!-- Branch Wire Splitters to 3 Provider Cards -->
    <path d="M 240 280 L 88 280 L 88 296" fill="none" stroke="#293d55" stroke-width="2" />
    <path d="M 240 280 L 240 296" fill="none" stroke="#293d55" stroke-width="2" />
    <path d="M 240 280 L 392 280 L 392 296" fill="none" stroke="#293d55" stroke-width="2" />

    <!-- Layer 3: 3 Output Capabilities -->
    <g transform="translate(20, 296)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="92" rx="9" fill="#14263f" stroke="#243f66" stroke-width="1.5" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#edf5fa">Mã nguồn &amp; File</text>
        <text x="10" y="38" font-size="10" font-weight="600" fill="#64e2d5">Đọc &amp; Sửa trực tiếp</text>
        <text x="10" y="56" font-size="9" font-weight="400" fill="#9eafc0">Tìm file thông minh,</text>
        <text x="10" y="70" font-size="9" font-weight="400" fill="#9eafc0">sửa code chuẩn xác,</text>
        <text x="10" y="84" font-size="9" font-weight="400" fill="#9eafc0">chạy lệnh kiểm thử</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="140" height="92" rx="9" fill="#14263f" stroke="#243f66" stroke-width="1.5" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#edf5fa">Phần mềm kỹ thuật</text>
        <text x="10" y="38" font-size="10" font-weight="600" fill="#ff977c">AutoCAD · SolidWorks</text>
        <text x="10" y="56" font-size="9" font-weight="400" fill="#9eafc0">SketchUp, Blender,</text>
        <text x="10" y="70" font-size="9" font-weight="400" fill="#9eafc0">KiCad tự động vẽ</text>
        <text x="10" y="84" font-size="9" font-weight="400" fill="#9eafc0">và tạo mô hình 3D</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="138" height="92" rx="9" fill="#14263f" stroke="#243f66" stroke-width="1.5" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#edf5fa">Trí nhớ &amp; Mở rộng</text>
        <text x="10" y="38" font-size="10" font-weight="600" fill="#38bdf8">CyberBrain Memory</text>
        <text x="10" y="56" font-size="9" font-weight="400" fill="#9eafc0">Lưu nhớ thói quen,</text>
        <text x="10" y="70" font-size="9" font-weight="400" fill="#9eafc0">kết nối script</text>
        <text x="10" y="84" font-size="9" font-weight="400" fill="#9eafc0">và API riêng của bạn</text>
      </g>
    </g>
  </g>

  <!-- Bottom Timeline & Status Bar -->
  <g class="text-base">
    <line x1="40" y1="500" x2="920" y2="500" stroke="#293d55" stroke-width="1.5" />
    <rect x="40" y="499" height="3" rx="1.5" fill="#64e2d5" class="timeline-bar" filter="url(#cyanGlow)" />
    <text x="40" y="524" font-size="11" font-weight="700" fill="#9eafc0" letter-spacing="0.5">SLNCTRZ-MCP  |  CẦU NỐI AI VÀ MÁY TÍNH CỦA BẠN</text>
    <text x="920" y="524" font-size="11" font-weight="700" fill="#64e2d5" text-anchor="end" class="mono">github.com/SlncTrZ/SlncTrZ-MCP</text>
  </g>
</svg>